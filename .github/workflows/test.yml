name: Tests

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: job-labor-proto/package-lock.json

      - name: Install dependencies
        working-directory: ./job-labor-proto
        run: npm ci

      - name: Run unit tests
        working-directory: ./job-labor-proto
        run: npm test -- --coverage --testPathPattern="__tests__/(services|utils)" --maxWorkers=2

      - name: Run integration tests
        working-directory: ./job-labor-proto
        run: npm test -- --testPathPattern="__tests__/(auth.integration|e2e)" --maxWorkers=2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./job-labor-proto/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: job-labor-proto/package-lock.json

      - name: Install dependencies
        working-directory: ./job-labor-proto
        run: npm ci

      - name: Run linter (if configured)
        working-directory: ./job-labor-proto
        run: |
          if [ -f "package.json" ] && grep -q "\"lint\"" package.json; then
            npm run lint
          else
            echo "No lint script found, skipping linting"
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Some tests or linting failed"
            exit 1
          else
            echo "All tests and linting passed"
          fi

